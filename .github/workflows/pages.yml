# Publish the deck via GitHub Actions instead of the legacy Jekyll builder.
#
# The legacy builder is deprecated and had become unreliable for this repo:
# clean commits returned "Page build failed", and retriggered builds sat in the
# queue for 20+ minutes with duration=0ms while a healthy build here takes ~47s.
# This uploads the repo as-is and deploys it — no Jekyll, no build step.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; never run two deploys at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
